# StrackS backend — Quarkus

# --- HTTP / API
quarkus.http.port=8080
# Écouter sur toutes les interfaces (pas seulement localhost) : nécessaire pour qu'un
# appareil physique (Expo Go) sur le même Wi-Fi puisse joindre l'API via l'IP du Mac.
quarkus.http.host=0.0.0.0

# CORS : requis pour le preview web (Expo tourne sur un port différent de l'API — cross-origin
# du point de vue du navigateur). Sans effet sur l'app native iOS/Android (fetch RN n'applique
# pas CORS) — seul le mode web (npx expo start --web) en a besoin.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/http://localhost:[0-9]+/
quarkus.http.cors.methods=GET,POST,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization

# --- Base de données (dev & test : Dev Services démarre un PostgreSQL via Docker)
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/stracks}
%prod.quarkus.datasource.username=${DATABASE_USER:stracks}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD:stracks}

quarkus.hibernate-orm.database.generation=none
# Colonnes JSONB : sérialisation Hibernate standard (pas de customisation Jackson côté REST)
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.flyway.migrate-at-start=true

# --- JWT (SmallRye)
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://stracks.app
smallrye.jwt.sign.key.location=privateKey.pem
# Durée de vie du token : 7 jours
stracks.jwt.ttl-seconds=604800

# --- OpenAPI / Swagger UI
quarkus.smallrye-openapi.info-title=StrackS API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
