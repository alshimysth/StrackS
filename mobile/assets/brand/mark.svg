<!--
  StrackS mark: a proposal derived from the theme.ts tokens (finishing lot 5), UNTIL a
  version comes out of the Claude Design project. An S-shaped route (a session's track)
  ending on the volt dot: the colour reserved for celebrations marks the finish. No text:
  readable at 20 px as at 1024 px, and no font to embed.

  Colours: primary500 #3d78e6 (background), neutral0 #ffffff (track), volt500 #d9f36a (finish).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <path d="M 67 28 C 67 16, 33 16, 33 32 C 33 46, 67 46, 67 62 C 67 80, 33 80, 33 70"
        fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="33" cy="70" r="8.5" fill="#d9f36a"/>
</svg>
