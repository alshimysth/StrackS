name: Mobile CI

# Vérification statique du mobile (pas de déploiement) : typecheck + bundle web,
# sur chaque push et pull request touchant mobile/**.

on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 20 LTS : supporté par Expo SDK 54 (le projet ne fige pas d'engines).
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Vérifie seulement que l'app bundle sans erreur — ne déploie rien.
      - name: Static web bundle
        run: npx expo export --platform web
