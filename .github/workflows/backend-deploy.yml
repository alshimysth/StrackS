name: Backend Deploy

# Continuous deployment of the backend: only on push to main touching backend/**
# (or deploy/**), plus manual trigger. Three sequential jobs:
#   test → build-and-push (image → GHCR) → deploy (SSH to VPS + external health check).

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

jobs:
  # 1. Reuses backend-ci's tests as is (JDK 25, ephemeral JWT keys, mvnw test).
  test:
    uses: ./.github/workflows/backend-ci.yml

  # 2. Builds the Docker image (Dockerfile.jvm) and pushes it to GHCR (public).
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Dockerfile.jvm copies an ALREADY built jar → it must be packaged first.
      # -DskipTests: the tests are already validated by the `test` job.
      # No key generation here: the image must stay keyless (keys mounted at runtime).
      - name: Package application
        working-directory: backend
        run: ./mvnw -B package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            ghcr.io/alshimysth/stracks-backend:latest
            ghcr.io/alshimysth/stracks-backend:${{ github.sha }}

  # 3. Drops the compose file on the VPS, pull + up, then ACTUALLY checks public health.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Drops docker-compose.prod.yml into /root/stracks (which already holds .env + keys/,
      # created once on the VPS). strip_components removes the `deploy/` prefix.
      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          # The compose file and the backup scripts (#45); the backup/keys directory is
          # created by hand on the VPS and never comes from the repository.
          source: "deploy/docker-compose.prod.yml,deploy/backup/backup.sh,deploy/backup/entrypoint.sh"
          target: "/root/stracks"
          strip_components: 1

      - name: Pull & restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /root/stracks
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      # REAL check from the runner (hence from outside the VPS): the job fails if the
      # public API doesn't answer 200/UP in time (Traefik must also have provisioned the
      # certificate on the first deployment).
      - name: Verify deployment (external health check)
        run: |
          url="https://stracks.alshimysth.cloud/q/health/live"
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "$url" || true)
            echo "Attempt $i/20 → HTTP ${code:-000}"
            if [ "$code" = "200" ] && grep -q '"status"[[:space:]]*:[[:space:]]*"UP"' /tmp/health.json; then
              echo "Backend UP:"; cat /tmp/health.json; exit 0
            fi
            sleep 10
          done
          echo "Health check FAILED after retries"; cat /tmp/health.json 2>/dev/null || true
          exit 1
