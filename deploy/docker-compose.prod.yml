# Déploiement production StrackS sur le VPS (Ubuntu + Docker).
#
# Intégration au reverse proxy EXISTANT du VPS : Traefik, sur le réseau Docker
# externe `root_default` (même pattern que budget-app). Traefik termine le TLS
# (certresolver `mytlschallenge` = Let's Encrypt) et route
# https://stracks.alshimysth.cloud vers ce backend. AUCUN port n'est publié sur
# l'hôte : Traefik atteint le conteneur par le réseau partagé.
#
# Secrets/valeurs (DATABASE_PASSWORD, clés JWT) : fichier `.env` + dossier de clés
# créés UNE SEULE FOIS sur le VPS, jamais commités (cf. deploy/.env.example).

services:
  postgres:
    image: postgres:18-alpine
    container_name: stracks-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-stracks}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD manquant dans .env}
      POSTGRES_DB: stracks
    # PostgreSQL 18+ stocke les données dans un sous-dossier de /var/lib/postgresql
    # (plus dans /var/lib/postgresql/data). Monter le volume sur le parent, sinon
    # l'image 18 refuse de démarrer (garde-fou anti-perte de données).
    volumes:
      - stracks_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-stracks} -d stracks"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ghcr.io/alshimysth/stracks-backend:latest
    container_name: stracks-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Profil %prod : lit ces variables (cf. application.properties).
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/stracks}
      DATABASE_USER: ${DATABASE_USER:-stracks}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD manquant dans .env}
      # Clés JWT montées en lecture seule — jamais dans l'image (design §5).
      # Préfixe file: obligatoire : SmallRye résout ces locations comme des URL
      # (un chemin absolu nu → MalformedURLException "no protocol").
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: file:/deployments/keys/publicKey.pem
      SMALLRYE_JWT_SIGN_KEY_LOCATION: file:/deployments/keys/privateKey.pem
      # Monitoring des erreurs (lot 5) : vide = désactivé.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    volumes:
      - ${JWT_KEYS_DIR:-./keys}:/deployments/keys:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/q/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stracks.rule=Host(`stracks.alshimysth.cloud`)"
      - "traefik.http.routers.stracks.entrypoints=websecure"
      - "traefik.http.routers.stracks.tls.certresolver=mytlschallenge"
      - "traefik.http.services.stracks.loadbalancer.server.port=8080"
      - "traefik.docker.network=root_default"
    networks:
      - default
      - root_default
    restart: unless-stopped

  # Sauvegarde quotidienne chiffrée hors du VPS (#45). Profil `backup` : ce service ne
  # démarre PAS avec le déploiement tant qu'il n'est pas activé par COMPOSE_PROFILES=backup
  # dans .env — c'est-à-dire tant que le stockage distant et la clé publique GPG n'existent
  # pas. Sans ce garde-fou, le prochain déploiement lancerait un conteneur en échec.
  # Procédure complète : docs/release/RUNBOOK.md, section « Sauvegardes ».
  backup:
    image: postgres:18-alpine # même version majeure que la base : pg_dump doit la suivre
    container_name: stracks-backup
    profiles: ["backup"]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "/backup/entrypoint.sh"]
    environment:
      DATABASE_USER: ${DATABASE_USER:-stracks}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD manquant dans .env}
      PGHOST: postgres
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-}
      BACKUP_AT: ${BACKUP_AT:-03:15}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      # Stockage S3 compatible, lu par rclone (distant nommé « store »).
      RCLONE_CONFIG_STORE_TYPE: s3
      RCLONE_CONFIG_STORE_PROVIDER: ${BACKUP_S3_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_STORE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_STORE_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_STORE_REGION: ${BACKUP_S3_REGION:-auto}
    volumes:
      - ./backup:/backup:ro
    restart: unless-stopped

networks:
  default:
  root_default:
    external: true

volumes:
  stracks_pgdata:
