name: Backend Deploy

# Déploiement continu du backend : uniquement sur push vers main touchant backend/**
# (ou deploy/**), + déclenchement manuel. Trois jobs séquentiels :
#   test → build-and-push (image → GHCR) → deploy (SSH VPS + vérif santé externe).

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

jobs:
  # 1. Réutilise à l'identique les tests de backend-ci (JDK 25, clés JWT éphémères, mvnw test).
  test:
    uses: ./.github/workflows/backend-ci.yml

  # 2. Construit l'image Docker (Dockerfile.jvm) et la pousse sur GHCR (public).
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Dockerfile.jvm copie un jar DÉJÀ construit → il faut packager avant.
      # -DskipTests : les tests sont déjà validés par le job `test`.
      # Pas de génération de clés ici : l'image doit rester keyless (clés montées au runtime).
      - name: Package application
        working-directory: backend
        run: ./mvnw -B package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/src/main/docker/Dockerfile.jvm
          push: true
          tags: |
            ghcr.io/alshimysth/stracks-backend:latest
            ghcr.io/alshimysth/stracks-backend:${{ github.sha }}

  # 3. Dépose le compose sur le VPS, pull + up, puis vérifie RÉELLEMENT la santé publique.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Dépose docker-compose.prod.yml dans /root/stracks (qui contient déjà .env + keys/,
      # créés une seule fois sur le VPS). strip_components retire le préfixe `deploy/`.
      - name: Copy compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "deploy/docker-compose.prod.yml"
          target: "/root/stracks"
          strip_components: 1

      - name: Pull & restart on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            cd /root/stracks
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

      # Vérification RÉELLE depuis le runner (donc de l'extérieur du VPS) : le job échoue
      # si l'API publique ne répond pas 200/UP dans le délai (Traefik doit aussi avoir
      # provisionné le certificat au premier déploiement).
      - name: Verify deployment (external health check)
        run: |
          url="https://stracks.alshimysth.cloud/q/health/live"
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' "$url" || true)
            echo "Attempt $i/20 → HTTP ${code:-000}"
            if [ "$code" = "200" ] && grep -q '"status"[[:space:]]*:[[:space:]]*"UP"' /tmp/health.json; then
              echo "Backend UP:"; cat /tmp/health.json; exit 0
            fi
            sleep 10
          done
          echo "Health check FAILED after retries"; cat /tmp/health.json 2>/dev/null || true
          exit 1
