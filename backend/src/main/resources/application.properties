# StrackS backend — Quarkus

# --- HTTP / API
quarkus.http.port=8080

# --- Base de données (dev & test : Dev Services démarre un PostgreSQL via Docker)
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/stracks}
%prod.quarkus.datasource.username=${DATABASE_USER:stracks}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD:stracks}

quarkus.hibernate-orm.database.generation=none
# Colonnes JSONB : sérialisation Hibernate standard (pas de customisation Jackson côté REST)
quarkus.hibernate-orm.mapping.format.global=ignore
quarkus.flyway.migrate-at-start=true

# --- JWT (SmallRye)
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://stracks.app
smallrye.jwt.sign.key.location=privateKey.pem
# Durée de vie du token : 7 jours
stracks.jwt.ttl-seconds=604800

# --- OpenAPI / Swagger UI
quarkus.smallrye-openapi.info-title=StrackS API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.swagger-ui.always-include=true
