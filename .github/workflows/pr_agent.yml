name: PR Agent (Claude)

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: write
    name: Run PR Agent on every pull request, respond to comments
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Clé Anthropic (Claude) — à créer dans Settings > Secrets and variables > Actions
          ANTHROPIC.KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          # Quels outils tournent automatiquement sur chaque PR
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          # /improve fait un appel LLM en plus (donc un coût en plus) : mets "true"
          # si tu veux aussi des suggestions de code automatiques sur chaque PR
          github_action_config.auto_improve: "false"