name: Mobile CI

# Mobile checks (no deployment): typecheck + unit tests + web bundle, on every push and
# pull request touching mobile/**.

# One backend file on top of mobile/**: the source read by the preferences parity test
# (#56). Without it, changing a bound on the Java side would never rerun the test meant to
# detect the divergence from the zod mirror.
on:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
      - "backend/src/main/java/com/stracks/core/user/PreferencesService.java"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-ci.yml"
      - "backend/src/main/java/com/stracks/core/user/PreferencesService.java"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22 LTS: supported by Expo SDK 54 (the project doesn't pin engines).
      # Moved from 20 to 22 when tests arrived (#40): Node 20 has been end-of-life since
      # April 2026, and better-sqlite3, used by the buffer tests to run real SQL, no longer
      # publishes a prebuilt binary for Node 20's ABI, which would force a node-gyp build.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Unit tests (#40). First among the checks that can fail on business logic:
      # `metrics.ts` must stay the exact mirror of GpsComputations.java, a threshold drift
      # breaks here.
      - name: Unit tests
        run: npm test -- --ci

      # Only checks that the app bundles without error; deploys nothing.
      - name: Static web bundle
        run: npx expo export --platform web
