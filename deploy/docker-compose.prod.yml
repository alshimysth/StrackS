# StrackS production deployment on the VPS (Ubuntu + Docker).
#
# Plugs into the VPS's EXISTING reverse proxy: Traefik, on the external Docker network
# `root_default` (same pattern as budget-app). Traefik terminates TLS
# (certresolver `mytlschallenge` = Let's Encrypt) and routes
# https://stracks.alshimysth.cloud to this backend. NO port is published on the host:
# Traefik reaches the container through the shared network.
#
# Secrets/values (DATABASE_PASSWORD, JWT keys): `.env` file + key directory created
# ONCE on the VPS, never committed (see deploy/.env.example).

services:
  postgres:
    image: postgres:18-alpine
    container_name: stracks-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-stracks}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD missing from .env}
      POSTGRES_DB: stracks
    # PostgreSQL 18+ stores its data in a subdirectory of /var/lib/postgresql (no longer
    # in /var/lib/postgresql/data). Mount the volume on the parent, otherwise the 18 image
    # refuses to start (a guard against data loss).
    volumes:
      - stracks_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-stracks} -d stracks"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: ghcr.io/alshimysth/stracks-backend:latest
    container_name: stracks-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # %prod profile: reads these variables (see application.properties).
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/stracks}
      DATABASE_USER: ${DATABASE_USER:-stracks}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD missing from .env}
      # JWT keys mounted read-only, never in the image (design §5).
      # The file: prefix is mandatory: SmallRye resolves these locations as URLs
      # (a bare absolute path → MalformedURLException "no protocol").
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: file:/deployments/keys/publicKey.pem
      SMALLRYE_JWT_SIGN_KEY_LOCATION: file:/deployments/keys/privateKey.pem
      # Error monitoring (lot 5): empty = disabled.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
    volumes:
      - ${JWT_KEYS_DIR:-./keys}:/deployments/keys:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/q/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stracks.rule=Host(`stracks.alshimysth.cloud`)"
      - "traefik.http.routers.stracks.entrypoints=websecure"
      - "traefik.http.routers.stracks.tls.certresolver=mytlschallenge"
      - "traefik.http.services.stracks.loadbalancer.server.port=8080"
      - "traefik.docker.network=root_default"
    networks:
      - default
      - root_default
    restart: unless-stopped

  # Daily encrypted backup off the VPS (#45). `backup` profile: this service does NOT
  # start with the deployment until enabled by COMPOSE_PROFILES=backup in .env, that is,
  # until the remote storage and the GPG public key exist. Without this guard, the next
  # deployment would start a failing container.
  # Full procedure: docs/release/RUNBOOK.md, backups section.
  backup:
    image: postgres:18-alpine # same major version as the database: pg_dump must follow it
    container_name: stracks-backup
    profiles: ["backup"]
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "/backup/entrypoint.sh"]
    environment:
      DATABASE_USER: ${DATABASE_USER:-stracks}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD missing from .env}
      PGHOST: postgres
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-}
      BACKUP_AT: ${BACKUP_AT:-03:15}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
      # S3-compatible storage, read by rclone (remote named "store").
      RCLONE_CONFIG_STORE_TYPE: s3
      RCLONE_CONFIG_STORE_PROVIDER: ${BACKUP_S3_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_STORE_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_STORE_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_STORE_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_STORE_REGION: ${BACKUP_S3_REGION:-auto}
    volumes:
      - ./backup:/backup:ro
    restart: unless-stopped

networks:
  default:
  root_default:
    external: true

volumes:
  stracks_pgdata:
