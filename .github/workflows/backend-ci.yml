name: Backend CI

# Build + tests of the Quarkus backend on every push and pull request touching backend/**.
# Testcontainers / Dev Services work as is: the ubuntu-latest runner has Docker preinstalled.

on:
  # Reusable by backend-deploy.yml (`test` job) so the steps aren't duplicated.
  workflow_call:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pom targets maven.compiler.release=25 and Dockerfile.jvm uses openjdk-25:
      # CI MUST use JDK 25, not 21 (otherwise compilation fails).
      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # JWT keys (*.pem) are deliberately gitignored (one pair per environment, see
      # README §2). On a fresh clone they're missing → we generate an EPHEMERAL pair,
      # specific to this run, never committed. Without it, the Quarkus boot of the auth
      # tests (JWT signing/verification) would fail.
      - name: Generate ephemeral JWT keys
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out src/main/resources/privateKey.pem
          openssl rsa -pubout -in src/main/resources/privateKey.pem \
            -out src/main/resources/publicKey.pem

      - name: Run tests
        run: ./mvnw -B test
